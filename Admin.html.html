<!-- views/admin.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المسؤول</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <!-- شريط التنقل -->
        <nav class="navbar">
            <div class="nav-header">
                <h2><i class="fas fa-user-shield"></i> لوحة تحكم المسؤول</h2>
                <button id="logoutBtn" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
                </button>
            </div>
        </nav>
        
        <div class="admin-content">
            <!-- قسم إضافة مستخدم جديد -->
            <div class="card">
                <h3><i class="fas fa-user-plus"></i> إضافة مستخدم جديد</h3>
                <form id="addUserForm" class="user-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="newUsername">اسم المستخدم</label>
                            <input type="text" id="newUsername" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="newPassword">كلمة المرور</label>
                            <input type="password" id="newPassword" name="password" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fullName">الاسم الكامل</label>
                            <input type="text" id="fullName" name="full_name" required>
                        </div>
                        <div class="form-group">
                            <label for="role">الصلاحية</label>
                            <select id="role" name="role" required>
                                <option value="user">مستخدم</option>
                                <option value="admin">مسؤول</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="grade">الدرجة الوظيفية</label>
                            <input type="text" id="grade" name="grade" required>
                        </div>
                        <div class="form-group">
                            <label for="age">العمر</label>
                            <input type="number" id="age" name="age" required min="18" max="100">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="department">القسم / مكان العمل</label>
                        <input type="text" id="department" name="department" required>
                    </div>
                    
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-save"></i> حفظ المستخدم
                    </button>
                </form>
            </div>
            
            <!-- قائمة المستخدمين -->
            <div class="card">
                <h3><i class="fas fa-users"></i> قائمة المستخدمين في النظام</h3>
                <div class="table-container">
                    <table id="usersTable">
                        <thead>
                            <tr>
                                <th>اسم المستخدم</th>
                                <th>الاسم الكامل</th>
                                <th>الصلاحية</th>
                                <th>الدرجة</th>
                                <th>العمر</th>
                                <th>القسم</th>
                                <th>تاريخ الإضافة</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- سيتم ملء الجدول بالبيانات من قاعدة البيانات -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/js/admin.js"></script>
</body>
</html>
